[workspace]
resolver = "3"
members = [
    "crates/abl-extract",
    "crates/abl-keys",
    "tools/ablkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[workspace.dependencies]
lzma-rs = "0.3.0"
sha2 = { version = "0.10.9", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

# TEMPORARY w2-vbh: the published avb-kit revision drops the chain descriptor
# flags. Replace this patch with the pushed revision before merge.
[patch."https://github.com/1vivy/avb-kit"]
avb-chain = { path = "../avb-kit-w2/crates/avb-chain" }
avb-format = { path = "../avb-kit-w2/crates/avb-format" }
avb-verify = { path = "../avb-kit-w2/crates/avb-verify" }
